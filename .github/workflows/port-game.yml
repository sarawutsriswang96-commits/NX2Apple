name: Build Game IPA (A13 + Separate RomFS)

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Direct Link ของไฟล์เกม (.nsp, .xci, .nsz)'
        required: true
        type: string
      keys_url:
        description: 'Direct Link ของไฟล์ prod.keys'
        required: true
        type: string
      a13_older_device:
        description: 'เปิดโหมดชิป A13 / A15 ลงไป (iPhone 11 Pro Max)'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Engine and Dependencies
        run: |
          python3 tools/engine.py sync
          brew bundle --file=Brewfile
          python3 -m venv .venv
          .venv/bin/python -m pip install lz4 "capstone>=5,<6" fonttools zbic nsz "backports.zstd; python_version < '3.14'"

      - name: Download game and prod.keys
        run: |
          mkdir -p input work
          curl -L "${{ inputs.game_url }}" -o input/game.nsp
          curl -L "${{ inputs.keys_url }}" -o input/prod.keys

      - name: Configure A13 Older Device Mode
        run: |
          touch work/env.txt
          if [ "${{ inputs.a13_older_device }}" == "true" ]; then
            echo "DM_PROF_TEX_BC_CPU=1" >> work/env.txt
          fi

      - name: Build Unsigned IPA and Separate RomFS
        run: |
          .venv/bin/python engine/scripts/build_ipa_from_nsp.py input \
            -k input/prod.keys \
            --work-dir work \
            --romfs separate \
            --env-file work/env.txt \
            --allow-other-metal \
            --progress lines

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: 1-Game-App-IPA
          path: |
            input/*.ipa
            work/**/*.ipa

      - name: Upload Separate Game Data (RomFS.img)
        uses: actions/upload-artifact@v4
        with:
          name: 2-Game-Data-RomFS
          path: work/extract/*/RomFS.img
