name: Build Separate IPA & Game Data (A13 Ready)

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Direct Link ของไฟล์เกม (.nsp, .xci, .nsz)'
        required: true
        type: string
      keys_url:
        description: 'Direct Link ของไฟล์ prod.keys'
        required: true
        type: string
      a13_older_device:
        description: 'เปิดโหมดชิป A13 / A15 ลงไป (iPhone 11 Pro Max)'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 & Dependencies
        run: |
          brew install python@3.12 xcodegen
          python3.12 tools/engine.py sync
          python3.12 -m venv .venv
          .venv/bin/python -m pip install lz4 "capstone>=5,<6" fonttools zbic nsz backports.zstd

      - name: Download and Verify Files
        run: |
          mkdir -p input work out_ipa out_data
          curl -fL "${{ inputs.game_url }}" -o input/game.nsp
          curl -fL "${{ inputs.keys_url }}" -o input/prod.keys
          ls -lh input/

      - name: Configure A13 Older Device Mode
        run: |
          touch work/env.txt
          if [ "${{ inputs.a13_older_device }}" == "true" ]; then
            echo "DM_PROF_TEX_BC_CPU=1" >> work/env.txt
          fi

      - name: Build Separate IPA and Game Data
        run: |
          .venv/bin/python engine/scripts/build_ipa_from_nsp.py input \
            -k input/prod.keys \
            --work-dir work \
            --romfs separate \
            --env-file work/env.txt \
            --allow-other-metal \
            --progress lines

      - name: Collect IPA and Game Data
        run: |
          find . -maxdepth 5 -name "*.ipa" -exec cp {} out_ipa/ \;
          find work -name "*.img" -exec cp {} out_data/ \;
          ls -lh out_ipa/ out_data/

      - name: Upload 1 - Game Launcher (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: 1-Game-App-IPA
          path: out_ipa/*.ipa
          if-no-files-found: error

      - name: Upload 2 - Game Data (.img)
        uses: actions/upload-artifact@v4
        with:
          name: 2-Game-Data-Files
          path: out_data/*.img
          if-no-files-found: error
